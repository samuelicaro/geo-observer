[project]
name = "geo-observer"
version = "0.1.0"
description = "Projeto feito para a disciplina de Sistemas Distribuídos da faculdade."
authors = [
    {name = "Samuel Ícaro"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic (>=2.14.2,<3.0.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "geoalchemy2 (>=0.18,<1)",
    "psycopg[binary] (>=3.2,<4)",
    "minio (>=7.2,<8)",
    "python-dotenv (>=1,<2)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
